name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo 'TMDB_BEARER_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxMzRjYTA1NDlmZTZjY2RmOTkyYWVkZGMyYmZiMzlmNiIsIm5iZiI6MTc3NzIyMTIwOC4wMjU5OTk4LCJzdWIiOiI2OWVlM2U1OGQzNThmMDhjNDUyOGRjZTAiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.CKXcYHhcQHKW3tIuDViHCQwAu6-hh--hoopAnDUeIUM' >> local.properties
          echo 'TMDB_API_KEY=134ca0549fe6ccdf992aeddc2bfb39f6' >> local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieCatalog-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
