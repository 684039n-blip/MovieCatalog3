name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Дозволяє GitHub Actions робити пуш у репозиторій
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          # Використовуємо ls (літера L), а не 1s (цифра 1)
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            
            # Видаляємо старий README щоб не конфліктував
            rm -f README.md
            
            # Розархівовуємо файл (-o = перезаписувати без запитань)
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
            
            # Налаштування Git та коміт
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add .
            git commit -m "Extract project files" || echo "No changes to commit"
            git push
          else
            echo "No ZIP file found"
          fi
